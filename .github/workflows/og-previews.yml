name: Build link previews

# Every push to main: make sure each case study's link preview matches its
# homepage card image, and every other page has the favicon preview.
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'images/**'
      - 'scripts/build_og.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: og-previews
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Build previews
        run: python scripts/build_og.py

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update link previews"
          git push
