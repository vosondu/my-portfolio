    <p>At the very top, some Lagos agencies listed on <a href="https://clutch.co/ng/agencies/branding/lagos" rel="noopener" target="_blank">Clutch</a> set minimum project sizes of $25,000, which puts them well beyond the ranges above.</p>
- type: note
  body: |
    <p>A note on these numbers: they come from 2026 price guides published by Nigerian studios and agencies, plus public package listings. That makes them self-reported, not survey data, so read them as a map of the market rather than a quote. Sources: <a href="https://cacregister.com.ng/blog/logo-design-cost-in-nigeria" rel="noopener" target="_blank">CAC Register / Abakon Consult</a>, <a href="https://walemarketer.com/logo-design-pricing/" rel="noopener" target="_blank">Walemarketer</a>, <a href="https://kolonell.com/en/blog/logo-brand-identity-design-cost-lagos-2026" rel="noopener" target="_blank">Kolonell</a>, <a href="https://marexventures.com/startup-branding-cost-in-nigeria-2026/" rel="noopener" target="_blank">Marex Ventures</a>, <a href="https://viscorner.com/costs/cost-of-graphic-design-services-in-nigeria" rel="noopener" target="_blank">Viscorner</a>, <a href="https://www.topyougo.com/corporate-identity-design/" rel="noopener" target="_blank">TopYouGo</a>, <a href="https://branda.com.ng/product/logo-creation-design-brand-identity-package/" rel="noopener" target="_blank">Branda</a>.</p>
- type: text
  body: |
    <h2>Who you’re actually paying</h2>
    <p>The price follows the person, so it helps to know the three kinds of people who sell “branding” in Nigeria.</p>
    <p><strong>The generalist designer.</strong> Generalists understand good design and can make beautiful, even captivating work: flyers, social posts, event graphics, logos. What most lack is specific training in building identities that outlive the logo, and an understanding of how a design choice turns into a business result. Solo entrepreneurs and many early startups hire generalists for two reasons: budget, and not knowing how to reach the other two options.</p>
    <p><strong>The independent brand designer.</strong> These designers specialise in brand identity, for corporate or informal businesses, profit or non-profit, and their portfolio shows it. The difference you’ll notice is reasoning. A good brand designer can explain every major choice in terms of your business: your customer, your competitors, the impression you need to make. They also hand over guidelines so your team, printers and future designers can use the identity consistently. Many keep a network of other specialists (copywriters, illustrators, web developers), so they can take on larger projects and still deliver one coherent system.</p>
    <p><strong>The brand agency.</strong> An agency is a team, anywhere from a handful of people to hundreds. Each member owns one area: strategy, research, identity design, copy, packaging, motion, web, project management, all overseen by a creative director. That depth lets an agency run research and rollout at a scale a solo designer can’t, and catch details across many touchpoints at once. It also makes agencies the most expensive option, and often not the fastest, because more people means more process. When a company with massive recognition refreshes its brand, it usually turns to an agency, because the cost of getting it wrong is far higher than the fee.</p>
    <h2>A logo and a brand identity are different products</h2>
    <p>Most businesses that pay ₦25,000 for “branding” didn’t get a brand identity. They got a logo. That isn’t a scam. It’s simply a different product, and it helps to know which one you’re buying.</p>
    <p>A logo is one mark. A brand identity is the system around it: colours, typography, imagery, layout rules and guidelines, all built from an understanding of who you’re trying to reach. That understanding comes from work that happens before any design starts:</p>
    <ul>
    <li><strong>Audience research:</strong> who your customers are, what they value, and what makes them trust a business like yours.</li>
    <li><strong>Competitor review:</strong> how others in your space present themselves, and where there’s room to stand apart.</li>
    <li><strong>Brand audit:</strong> for existing businesses, what your current visuals are doing well and where they’re working against you.</li>
    <li><strong>Stakeholder conversations:</strong> usually the founder and a few customers. At agency scale, this can widen to staff, partners and investors.</li>
    </ul>
    <p>A ₦25,000 budget can’t cover that work. So what you get is artwork to paste across your touchpoints. A properly built identity gives you something more useful: a consistent, deliberate way of showing up that your customers learn to recognise and trust.</p>
    <p>Here’s what that looks like in practice. The founder of <a href="/joie-luxe-rentals">Joie Luxe Rentals</a>, a luxury apartment brand in Lekki, came to me for a new logo. In our discovery call, I found the real problem: the brand was drawing inquiries from people who couldn’t afford its apartments. Its Instagram explained why. Holiday clipart, stock scenery and a different typeface in every post all said budget agency. The apartments were luxury; the brand around them wasn’t, and a new logo alone wouldn’t have closed that gap. It’s still too early to say whether the right clients are now coming through the door. But that’s the problem the identity was built to solve.</p>
    <h2>Can AI make your logo?</h2>
    <p>Yes. For many small businesses, it already has. AI can produce a decent-looking mark in seconds, and for an idea you’re still testing, that can be enough. But there are three things worth knowing before you build a business on one.</p>
    <p><strong>It gives you an image, not a system.</strong> An AI tool hands you a picture. It doesn’t give you clean vector files, rules for colour and type, or guidelines for using the mark across signage, packaging and social media. And if you ask it again, you won’t get the same logo back. A logo works because people see the exact same thing every time. When businesses regenerate or “touch up” their logo with AI instead of using one master file, small differences creep in. Customers notice inconsistency, even if they can’t name it, and it quietly raises a question: what else isn’t getting attention?</p>
    <p><strong>It skips the thinking.</strong> AI doesn’t know your customers, your competitors or the problem your brand needs to solve. It produces something that looks like a logo for a business like yours, which is exactly why so many AI logos look alike.</p>
    <p><strong>Ownership is unsettled.</strong> In the US, purely AI-generated images generally can’t be protected by copyright, and a German court reached the same conclusion about an AI logo in February 2026. You can still use it and may be able to register it as a trademark, but stopping others from copying it is harder. Nigerian law hasn’t clearly settled the question yet. Sources: <a href="https://www.lovart.ai/blog/b43-ai-design-copyright-faq-bing" rel="noopener" target="_blank">Lovart on US Copyright Office position</a>, <a href="https://www.mtrlegal.com/en/understanding-copyright-aspects-of-ai-generated-logos/" rel="noopener" target="_blank">MTR Legal on the Munich ruling</a>, <a href="https://news.bloomberglaw.com/us-law-week/ai-generated-logos-require-careful-steps-to-protect-ip-rights" rel="noopener" target="_blank">Bloomberg Law</a>.</p>
    <h2>Do you own your logo? Files, rights and handover</h2>
    <p>One of the biggest hidden differences between a cheap logo and a professional identity is what you actually own at the end. When I charged ₦25,000 for a logo, I didn’t know enough to raise this. After four years of identity work and the complications that came with it, I’ve learned the best time to settle it is before the work starts.</p>
    <p>Before you pay anyone, ask for these in writing:</p>
    <ul>
    <li><strong>Who owns the rights, and when.</strong> Ownership should transfer to you in full, usually on final payment.</li>
    <li><strong>Which files you’ll receive.</strong> At minimum: vector source files (AI, SVG or EPS), PDF, and PNG versions in colour, black and white.</li>
    <li><strong>Font licences.</strong> If the identity uses a paid typeface, you may need your own licence to use it.</li>
    <li><strong>What the designer keeps.</strong> Most designers keep the right to show the work in their portfolio.</li>
    </ul>
    <p>My approach is simple. Once the final invoice is paid, you own full rights to the identity and its files. I only keep permission to share the project as a case study on my portfolio and social media.</p>
    <h2>How to choose: match the tier to your business stage</h2>
    <p>The right budget depends less on how much you can spend and more on what you stand to lose with the wrong identity.</p>
