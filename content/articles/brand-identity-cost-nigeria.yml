    - Rebrand or funded organisation
    - Several people need to agree, a launch date won’t move, and customers already recognise you, so brand equity is at stake.
    - A strategy-led rebrand or refresh, from a senior independent designer or an agency
    - 800,000 to 2,000,000+
- type: text
  body: |
    <p>If you’re in the third group, apply some caution during a full rebrand. Customers who already recognise you are an asset, and a refresh that keeps what they know often serves you better than starting over.</p>
    <h2>Where my packages sit</h2>
    <p>I’m an independent brand designer, so my work sits in the middle tier of the table above. My packages follow the same three stages as the table you read above.</p>
