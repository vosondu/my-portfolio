sections:
- type: text
  body: |
    <p>A self-initiated refresh for the Lagos convenience store chain my family bought from every Sunday while I was growing up in Ikorodu.</p>
    <p>I never liked the ‘a’ on their storefront 😅. But everyone recognises it, so I kept it and gave it a cleaner, more confident letterform. Yellow leads the palette so the brand reads from across the street.</p>
