- type: text
  body: |
    <p>After seeing the identity, the founder expanded the project beyond the logo: merchandise, invoice and receipt templates, and social media designs.</p>
- type: media
  items:
  - image: /images/Joie Luxe Rentals/Free paper and business cards mockup.webp
    alt: Joie Luxe stationery
  - image: /images/Joie Luxe Rentals/Invoice Mockup.webp
