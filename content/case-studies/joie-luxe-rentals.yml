sections:
- type: text
  body: |
    <p>The founder came to me for a new logo. In our discovery call, I found the real problem: Joie Luxe rents premium apartments in Lekki, but it was drawing inquiries from people who couldn’t afford them.</p>
    <p>Its social presence explained why. Holiday clipart, stock scenery, a different typeface in every post and a house-and-car icon all said budget agency. The apartments were luxury; the brand around them wasn’t.</p>
