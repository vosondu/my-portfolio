- type: text
  body: |
    <p>The new identity had to close that gap, so the right clients could recognise the standard before they ever asked the price.</p>
    <p>Before sketching, I studied what luxury actually communicates: Rolex, Patek Philippe, Aman. Aman stood out most, with its quiet photography and how little it says, and it became the north star for Joie Luxe.</p>
    <p>The research turned up one shape again and again: across the luxury apartments I studied, the arch kept recurring, and Joie Luxe’s own apartments carried it too. The mark joins that arch with the initials J and L. Then I tested it from building signage down to a clothing tag.</p>
