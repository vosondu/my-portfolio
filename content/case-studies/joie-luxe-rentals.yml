  title: 'Joie Luxe Rentals: Luxury Real Estate Brand Identity'
  description: 'Repositioning Joie Luxe Rentals, a luxury real estate brand drawing the wrong clients: logomark, brand guidelines, stationery, social media and merchandise shaped by quiet luxury.'
