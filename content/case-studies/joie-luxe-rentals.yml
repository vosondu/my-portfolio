- type: text
  body: |
    <p>It’s still too early to say whether the right clients are coming through the door. An identity only works if it’s used consistently, and that’s taught me to build more rollout support into every project.</p>
- type: quote
  quote: “The result was fabulous, the exact premium branding and feel I needed. Victor listened to my expectations patiently and delivered exactly what I wanted. I’m sticking with his services, and I’ve already referred him.”
  author: Joy Felix, Founder, Joie Luxe Rentals
