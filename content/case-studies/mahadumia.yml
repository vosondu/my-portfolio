sections:
- type: text
  body: |
    <p>Mahadumia’s identity was already in place. My role was to carry it into motion and app store visuals built for a fast-scrolling, mobile-first student audience.</p>
    <p>One rule shaped the motion work: no text stayed on screen for longer than 3 seconds. That was a compromise on accessibility, and we knew it. But our students scroll fast, and slower animation would have lost them, so we designed for them first.</p>
