sections:
  - type: text
    body: "<p>Zerah is Hebrew for shining. My first sketches tried to make the
      wordmark itself shine, and none of them worked: they either lost the idea
      of shining, or leaned so far into it that the name stopped reading as a
      name.</p><p>So the meaning moved into the mark. Its divergent rays carry
      it outward: one source of energy reaching into trade, energy, production
      and supply chain at once.</p><p>Four colours, none dominant, because no
      single sector defines the business.</p>"
