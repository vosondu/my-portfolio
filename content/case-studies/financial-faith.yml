  - type: text
    body: "<p>Faith Ifeanacho coaches young professionals on money through
      personality, starting with how each person naturally relates to it. Most
      financial advisers sound alike. This identity had to feel like being
      understood rather than assessed, closer to listening in therapy than to
      advice. The voice gets one test: does this sound like we are diagnosing
      someone, or genuinely trying to understand them?</p><p>My first routes, a
      fingerprint rising into an ascent and a curved monogram, felt too
      mathematical to Faith. The final mark interlocks two f’s into a form that
      reads as a DNA strand. Her method is Your Money Personality, and DNA is
      unique to each person, like the personality her coaching starts
      from.</p><p>Green and purple were once in mind. The palette went warm
      instead: deep espresso, rustic umber and burnished gold, to feel rooted
      and premium without being trendy or noisy. The motion identity adds
      neo-soul sound design and tactile micro-foley.</p>"
  - type: media
    items:
      - video: /images/Financial Faith/vids/Billboard Mockup.mp4
        alt: A cinematic video mockup of a high-end outdoor billboard displaying the
          Financial Faith brand identity against a moving camera push-in. The
          screen features the interlocking DNA double-helix "f" logomark set
          within a warm, architectural aesthetic of deep espresso and burnished
          gold. The motion piece seamlessly integrates smooth green-screen
          chroma keying, scale animation, and a custom warm neo-soul
          instrumental track with bespoke tactile sound effects.
        playback: controls
