sections:
- type: text
  body: |
    <p>Komi’s Kitchen didn’t start as a business. It started as a nickname.</p>
    <p>Komi had always been the one cooking at home in the village, but never took it seriously. Then came Lagos, and staying with a sister who started calling every meal “Komi’s kitchen.” The family were the ones who said: you can actually do this.</p>
    <p>From the moment we unpacked that story in discovery, I knew the identity had to carry pieces of it. Komi never trained as a chef. The cooking came from home, and the promise was simple:</p>
    <blockquote><p>“Any time you come to our restaurant to eat... you’ll literally get this flashback of the home meal you’ve been missing.”</p></blockquote>
    <p>So the mascot wears indigenous attire, to signal home-made. The palette is earthy, deep brown and ochre gold, for a real, down-to-earth first impression, like the calabashes our mothers cooked with. And the wordmark is set in Dancing Script, for the artistic expression that runs through the whole story.</p>
    <p>The tagline went through several versions before we settled on “Tastes like home.” It stood out because it held food and heritage in a single phrase. It also helped that it didn’t sound cheesy (at least to us 😅).</p>
