		<style>
			:root {
				--black: #131313;
				--grey-dark: #c8c8c2;
				--grey-mid: #7a7a76;
				--grey-light: #3a3a38;
				--grey-faint: #1a1a18;
				--white: #fafaf8;
				--serif: "DM Sans", system-ui, sans-serif;
				--sans: "DM Sans", system-ui, sans-serif;
				--fw: 300;
			}
			* { box-sizing: border-box; margin: 0; padding: 0; }
			body { font-family: var(--sans); background: var(--black); color: var(--white); line-height: 1.7; font-weight: var(--fw); }
			nav { display: flex; justify-content: space-between; padding: 1.4rem 4rem; border-bottom: 1px solid var(--grey-faint); background: rgba(17,17,16,0.92); backdrop-filter: blur(8px); }
			.nav-logo { color: var(--white); text-decoration: none; font-family: var(--serif); }
			.nav-links { display: flex; gap: 1.5rem; list-style: none; }
			.nav-links a { color: var(--grey-mid); text-decoration: none; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.8rem; }
			main { max-width: 900px; margin: 0 auto; padding: 4rem 4rem 6rem; }
			h1 { font-family: var(--serif); font-size: clamp(2rem, 4vw, 2.8rem); margin-bottom: 1rem; }
			.intro { color: var(--grey-dark); margin-bottom: 2rem; }
			.card { background: #121211; border: 1px solid var(--grey-faint); padding: 1.5rem; margin-top: 1.5rem; }
			p a, li a, h1 a, h2 a, h3 a, blockquote a, .section-body a, .content a {
				color: var(--white) !important;
				text-decoration: none !important;
				border-bottom: 1px solid var(--grey-light) !important;
				transition: color 0.2s, border-color 0.2s;
			}

			p a:hover, li a:hover, h1 a:hover, h2 a:hover, h3 a:hover, blockquote a:hover, .section-body a:hover, .content a:hover,
			p a:focus, li a:focus, h1 a:focus, h2 a:focus, h3 a:focus, blockquote a:focus, .section-body a:focus, .content a:focus {
				color: var(--grey-dark) !important;
				border-color: var(--grey-mid) !important;
				outline: none;
			}
			@media (max-width: 768px) { nav { padding: 1.2rem 1.5rem; } main { padding: 2.5rem 1.5rem 4rem; } }
		</style>
